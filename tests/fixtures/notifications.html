<!doctype html>
<!-- Synthetic copy of the LinkedIn Notifications layout: three columns on the shared 24-column grid. -->
<html lang="en">
<head><meta charset="utf-8"><title>Mock notifications</title></head>
<body style="margin:0">
<main>
  <div style="display:grid;grid-template-columns:repeat(24,17px);column-gap:24px;width:960px">
    <aside id="side" style="grid-column:1/7">Profile</aside>
    <section id="center" style="grid-column:7/17">Notification list</section>
    <aside id="rail" style="grid-column:17/-1">
      <div>
        <div>
          <div id="slot-ad">
            <div>
              <iframe title="advertisement" componentkey="NotificationDesktopNav_notifications_ad" style="height:250px;width:300px;border:0"></iframe>
            </div>
          </div>
          <div id="slot-footer"><footer><a href="https://about.linkedin.com/">About</a></footer></div>
        </div>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
