name: Release

# Push a tag v<manifest version> to test, build, and create a GitHub Release with the ZIP.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches the manifest
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./extension/manifest.json').version")"
      - run: npm ci
      - run: npx playwright install chromium
      - run: xvfb-run -a npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run build
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
          --notes "Read the account risk notice in the README before installing. To install, unzip the file and load the folder with Load unpacked in chrome://extensions."
        env:
          GH_TOKEN: ${{ github.token }}
